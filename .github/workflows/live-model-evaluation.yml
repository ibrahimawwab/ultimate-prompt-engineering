name: Live cross-model evaluation

on:
  workflow_dispatch:
    inputs:
      confirm_api_billing:
        description: "I authorize one run of up to 120 requests; estimated cost is about USD 0.19, not a spending cap."
        required: true
        type: boolean
        default: false
      allow_repeat_within_24h:
        description: "Explicitly allow another paid run if one was already attempted in the last 24 hours."
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: live-cross-model-evaluation
  cancel-in-progress: false

jobs:
  evaluate:
    if: ${{ inputs.confirm_api_billing == true && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Prevent accidental duplicate paid runs
        env:
          GITHUB_TOKEN: ${{ github.token }}
          ALLOW_REPEAT: ${{ inputs.allow_repeat_within_24h }}
        run: |
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          repository = os.environ["GITHUB_REPOSITORY"]
          current_run = os.environ["GITHUB_RUN_ID"]
          current_attempt = int(os.environ.get("GITHUB_RUN_ATTEMPT", "1"))
          token = os.environ["GITHUB_TOKEN"]
          api = os.environ.get("GITHUB_API_URL", "https://api.github.com")
          url = f"{api}/repos/{repository}/actions/workflows/live-model-evaluation.yml/runs?event=workflow_dispatch&branch=main&per_page=100"
          request = urllib.request.Request(url, headers={
              "Accept": "application/vnd.github+json",
              "Authorization": f"Bearer {token}",
              "X-GitHub-Api-Version": "2022-11-28",
          })
          with urllib.request.urlopen(request, timeout=15) as response:
              runs = json.loads(response.read().decode("utf-8")).get("workflow_runs", [])
          cutoff = datetime.datetime.now(datetime.timezone.utc) - datetime.timedelta(hours=24)
          recent = []
          for run in runs:
              if str(run.get("id")) == current_run:
                  continue
              created = datetime.datetime.fromisoformat(run["created_at"].replace("Z", "+00:00"))
              if created >= cutoff:
                  recent.append(run)
          allow_repeat = os.environ["ALLOW_REPEAT"].lower() == "true"
          if current_attempt > 1 and not allow_repeat:
              raise SystemExit(
                  "GitHub workflow reruns are blocked because an earlier attempt may already have incurred charges. "
                  "Set allow_repeat_within_24h=true only if another paid attempt is intentional."
              )
          if recent and not allow_repeat:
              previous = recent[0]
              raise SystemExit(
                  "A live evaluation was already dispatched in the last 24 hours "
                  f"(run {previous['id']}, status {previous['status']}). "
                  "Set allow_repeat_within_24h=true only if a second paid run is intentional."
              )
          print("No recent live evaluation was found, or repeat execution was explicitly allowed.")
          PY

      - name: Estimate run cost before provider requests
        run: |
          python - <<'PY'
          import datetime
          import json
          from pathlib import Path
          from evaluation.run_eval import SYSTEM_PROMPT, load_cases
          config = json.loads(Path("evaluation/config.example.json").read_text())
          cases = load_cases(Path("evaluation/cases.jsonl"))
          if len(cases) != 40 or len(config["models"]) != 3:
              raise SystemExit("Paid workflow is capped at exactly 40 cases across exactly 3 configured providers (120 planned requests).")
          today = datetime.date.today()
          for model in config["models"]:
              checked = datetime.date.fromisoformat(model["pricing_checked_date"])
              if (today - checked).days > 30:
                  raise SystemExit(f"Pricing for {model['name']} is more than 30 days old; re-verify it before a paid run.")
              valid_through = model.get("pricing_valid_through")
              if valid_through and today > datetime.date.fromisoformat(valid_through):
                  raise SystemExit(f"Pricing for {model['name']} has expired; update the rates before a paid run.")
          input_chars = len(SYSTEM_PROMPT) * len(cases) + sum(len(case["input"]) for case in cases) + 1000 * len(cases)
          input_token_proxy = input_chars
          output_tokens = len(cases) * config["settings"]["max_tokens"]
          total = 0.0
          for model in config["models"]:
              cost = (input_token_proxy * model["input_cost_per_1m_tokens"] +
                      output_tokens * model["output_cost_per_1m_tokens"]) / 1_000_000
              total += cost
              print(f"{model['name']}: estimated USD {cost:.4f}")
          print(f"Estimated combined total: USD {total:.4f}")
          print("Planning estimate only; provider tokenization, billing adjustments, and rates may differ.")
          print(f"Planned requests: {len(cases) * len(config['models'])}; retries: 0; output cap: {output_tokens} tokens/model.")
          PY

      - name: Verify required API secrets are configured
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
        run: |
          python - <<'PY'
          import os
          required = ("OPENAI_API_KEY", "ANTHROPIC_API_KEY", "GOOGLE_API_KEY")
          missing = [name for name in required if not os.environ.get(name)]
          if missing:
              raise SystemExit("Missing GitHub Actions secrets: " + ", ".join(missing))
          print("All required provider secrets are present.")
          PY

      - name: Validate evaluation configuration and dataset
        run: |
          python -m unittest discover -s evaluation/tests -v
          python evaluation/run_eval.py --config evaluation/config.example.json --cases evaluation/cases.jsonl --validate-only

      - name: Run live model comparison
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          PYTHONUNBUFFERED: "1"
        run: |
          python evaluation/run_eval.py --config evaluation/config.example.json --cases evaluation/cases.jsonl --output-dir evaluation-results

      - name: Upload evaluation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cross-model-evaluation-${{ github.run_id }}
          path: evaluation-results/
          if-no-files-found: error
          retention-days: 14
