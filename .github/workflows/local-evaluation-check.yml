name: Local evaluation offline checks

on:
  pull_request:
    paths:
      - "evaluation/**"
      - ".github/workflows/local-evaluation-check.yml"
  push:
    branches: [main]
    paths:
      - "evaluation/**"
      - ".github/workflows/local-evaluation-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12", "3.13"]
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run offline unit tests
        run: python -m unittest discover -s evaluation/tests -v
      - name: Validate local evaluation configuration and dataset
        run: python evaluation/run_local_eval.py --config evaluation/config.local.example.json --cases evaluation/cases.jsonl --validate-only
