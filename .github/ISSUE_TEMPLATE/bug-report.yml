name: Documentation or example bug
description: Report a broken link, incorrect claim, or reproducible example problem
title: "[Bug]: "
labels: ["bug"]
body:
  - type: dropdown
    id: kind
    attributes:
      label: Problem type
      options:
        - Incorrect or outdated information
        - Broken link
        - Example does not behave as described
        - Formatting or navigation issue
        - Other
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Affected file or section
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Description and reproduction steps
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior or correction
    validations:
      required: false
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I have removed credentials and sensitive information.
          required: true
